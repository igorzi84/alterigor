[project]
name = "alterigor"
version = "0.1.0"
description = "An AI portfolio assistant that answers questions about my experience, projects, and skills."
readme = "README.md"
authors = [
    { name = "Igor", email = "igor@zilberman.ca" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "openai-agents>=0.19.4",
    "pydantic>=2.13.4",
    "uvicorn[standard]>=0.52.1",
    "pydantic-settings>=2.14.2",
]


[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pytest>=9.1.1",
]
